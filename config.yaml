# Crypto Sentiment Trading Signal — single source of truth for locked parameters.
# Build Pathway Phase 0. Everything that defines the experiment lives here.

# --- The three locked decisions (Phase 0, step 2) ---
asset: BTC              # single asset for this project (Design §10)
bar_frequency: "1D"     # pandas offset alias: daily bars
holding_period_N: 1     # bars a trade stays open; N=1 => hold exactly one daily bar

# --- Backtest / decision parameters (Design §5.3, §4.10) ---
transaction_cost: 0.001 # fixed cost per trade as a fraction (0.1%); fee + spread assumption
decision_threshold: 0.0 # |forecast return| must exceed this to trade; TUNED ON TRAIN ONLY later

# --- Evaluation split (Phase 1, step 1) ---
split:
  train_frac: 0.70      # first 70% of time = train, last 30% = test. Never shuffle.

# --- Reproducibility (Design §8) ---
random_seed: 42
timezone: "UTC"

# --- Data paths ---
data:
  # Raw tweets dump (large, unsorted). Sampled+windowed by prepare_tweets.py.
  tweets_raw_path: "data/raw/bitcoin_tweets_latest.csv"
  tweets_encoding: "utf-8"
  tweets_sample_per_day: 3000   # reservoir sample/day for tractable VADER scoring
  # Optional: override auto-detected column names, e.g.
  # tweets_columns: {text: "text", date: "date", followers: "user_followers"}
  tweets_columns: null
  # Small windowed+sampled tweets file that build_features.py consumes.
  tweets_path: "data/processed/tweets_window.parquet"
  # NOTE: BTC1D.csv ends 2021-03 and does NOT overlap the 2025-26 tweet window.
  # btc_ohlcv_daily.csv (2012->2026, resampled from minute) is the one that covers it.
  ohlcv_path: "data/raw/btc_ohlcv_daily.csv"
  processed_path: "data/processed/modeling_table.parquet"  # built in Phase 2

# Modeling window — the dense tweet block that overlaps our OHLCV (Phase 2).
modeling_window:
  start: "2025-03-06"
  end: "2026-03-02"

# Empty-bar (no-tweet day) policy for sentiment features (Design §4.7):
#   "ffill" = hold the most recent sentiment across the gap (leak-free, our choice)
#   "zero"  = treat as neutral / no chatter
empty_bar: "ffill"
